<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body>
    <h1>My Python Web Page</h1>
    
    <!-- Create a dedicated div to hold your output -->
    <div id="output-box"></div>

    <script type="py">
        # 1. Use display() to inject directly into the page
        from pyscript import display
        dietCoke=15
        dietCokeQuantity=int(input("Diet Coke:"))
        dietCokeNeeded=0
        if dietCokeQuantity<15:
            dietCokeNeeded=15-dietCokeQuantity
            display(f"You need {dietCokeNeeded} more Diet Cokes.")
        else:
            display("You have enough Diet Cokes.")

    </script>
</body>
</html>
